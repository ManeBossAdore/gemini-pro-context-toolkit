<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#1a1f35"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#4f8cc9;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#4f8cc9;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" style="stop-color:#7c5cbf;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#7c5cbf;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="20%" r="40%">
      <stop offset="0%" style="stop-color:#2ea4a4;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#2ea4a4;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f8cc9;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#7c5cbf;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#4f8cc9;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="360" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="360" fill="url(#glow1)"/>
  <rect x="0" y="0" width="1200" height="360" fill="url(#glow2)"/>
  <rect x="0" y="0" width="1200" height="360" fill="url(#glow3)"/>

  <!-- Decorative shapes -->
  <circle cx="180" cy="90" r="60" fill="none" stroke="#4f8cc9" stroke-width="0.5" opacity="0.15"/>
  <circle cx="180" cy="90" r="120" fill="none" stroke="#4f8cc9" stroke-width="0.3" opacity="0.1"/>
  <circle cx="1020" cy="280" r="80" fill="none" stroke="#7c5cbf" stroke-width="0.5" opacity="0.15"/>
  <circle cx="1020" cy="280" r="150" fill="none" stroke="#7c5cbf" stroke-width="0.3" opacity="0.08"/>

  <!-- Floating particles -->
  <circle cx="100" cy="200" r="1.5" fill="#4f8cc9" opacity="0.25"/>
  <circle cx="250" cy="150" r="1" fill="#7c5cbf" opacity="0.2"/>
  <circle cx="350" cy="280" r="1.5" fill="#2ea4a4" opacity="0.2"/>
  <circle cx="550" cy="120" r="1" fill="#4f8cc9" opacity="0.15"/>
  <circle cx="700" cy="300" r="1.5" fill="#7c5cbf" opacity="0.2"/>
  <circle cx="850" cy="160" r="1" fill="#2ea4a4" opacity="0.18"/>
  <circle cx="950" cy="240" r="1.5" fill="#4f8cc9" opacity="0.15"/>
  <circle cx="1100" cy="130" r="1" fill="#7c5cbf" opacity="0.2"/>
  <circle cx="1150" cy="300" r="1.5" fill="#2ea4a4" opacity="0.15"/>
  <circle cx="450" cy="320" r="1" fill="#4f8cc9" opacity="0.12"/>
  <circle cx="650" cy="80" r="1" fill="#7c5cbf" opacity="0.15"/>
  <circle cx="80" cy="310" r="1" fill="#2ea4a4" opacity="0.2"/>

  <!-- Decorative lines -->
  <line x1="200" y1="320" x2="1000" y2="320" stroke="url(#lineGrad)" stroke-width="0.5" opacity="0.3"/>
  <line x1="300" y1="335" x2="900" y2="335" stroke="url(#lineGrad)" stroke-width="0.3" opacity="0.15"/>

  <!-- Subtle path decoration -->
  <path d="M0,200 Q300,160 600,210 T1200,180" fill="none" stroke="#4f8cc9" stroke-width="0.4" opacity="0.08"/>
  <path d="M0,240 Q400,280 800,230 T1200,260" fill="none" stroke="#7c5cbf" stroke-width="0.4" opacity="0.06"/>

  <!-- Small decorative nodes -->
  <circle cx="600" cy="310" r="2" fill="#4f8cc9" opacity="0.3"/>
  <circle cx="600" cy="310" r="6" fill="none" stroke="#4f8cc9" stroke-width="0.3" opacity="0.2"/>

  <!-- Headline -->
  <text x="600" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="56.0" font-weight="bold" fill="#ffffff">
    <tspan x="600" dy="0">Gemini 2.0 Pro 2M Context</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20.0" fill="#c9d1d9">
    <tspan x="600" dy="0">Toolkit for Gemini 2.0 Pro users — organize long docs</tspan>
    <tspan x="600" dy="28">and split context windows into manageable prompts.</tspan>
  </text>

  <!-- Decorative accent below text -->
  <line x1="480" y1="265" x2="720" y2="265" stroke="#4f8cc9" stroke-width="1" opacity="0.2"/>
  <circle cx="480" cy="265" r="2" fill="#4f8cc9" opacity="0.3"/>
  <circle cx="720" cy="265" r="2" fill="#4f8cc9" opacity="0.3"/>
</svg>